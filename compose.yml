name: ie3142-dvwa

services:
  dvwa:
    build:
      context: .
    image: ie3142-dvwa:local
    pull_policy: build
    environment:
      DB_SERVER: db
      DB_PORT: "3306"
      DB_DATABASE: dvwa
      DB_USER: dvwa
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4280:80"
    networks:
      - dvwa
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: dvwa
      MARIADB_USER: dvwa
      MARIADB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}"
      MARIADB_ROOT_HOST: localhost
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - dvwa:/var/lib/mysql
    networks:
      - dvwa
    restart: unless-stopped

volumes:
  dvwa:

networks:
  dvwa:
