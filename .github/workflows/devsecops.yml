name: DevSecOps CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test DVWA
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        shell: bash

    env:
      COMPOSE_PROJECT_NAME: ie3142-ci
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      DB_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
      DVWA_BASE_URL: http://127.0.0.1:4280
      CI_RESULTS_DIR: /tmp/ie3142-ci-results

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check configuration and record source
        run: |
          mkdir -p "$CI_RESULTS_DIR"
          git rev-parse HEAD > "$CI_RESULTS_DIR/source-commit.txt"
          sha256sum tests/test_security_regression.py > "$CI_RESULTS_DIR/test-script.sha256"
          printf '%s/%s/actions/runs/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > "$CI_RESULTS_DIR/run-url.txt"
          {
            docker --version
            docker compose version
            python3 --version
            uname -m
          } > "$CI_RESULTS_DIR/tool-versions.txt"
          if [[ -z "$DB_PASSWORD" || -z "$DB_ROOT_PASSWORD" ]]; then
            echo "::error::Configure CI_DB_PASSWORD and CI_DB_ROOT_PASSWORD."
            exit 1
          fi
          docker compose config --quiet

      - name: Build DVWA image
        run: |
          docker compose pull db
          docker compose --progress plain build --pull dvwa \
            2>&1 | tee "$CI_RESULTS_DIR/build-console.txt"
          docker image inspect ie3142-dvwa:local --format '{{.Id}}' \
            > "$CI_RESULTS_DIR/app-image-id.txt"

      - name: Start application and database
        run: |
          docker compose up -d --no-build --pull never --wait --wait-timeout 180

      - name: Initialize disposable CI database
        run: python3 -B -u tests/ci_setup_dvwa.py

      - name: Run 14 regression tests
        run: |
          set +e
          python3 -B -u tests/test_security_regression.py \
            2>&1 | tee "$CI_RESULTS_DIR/test-console.txt"
          tests_exit=$?
          set -e
          printf '%s\n' "$tests_exit" > "$CI_RESULTS_DIR/test-exit-code.txt"
          printf 'Test exit code: %s\n' "$tests_exit"
          exit "$tests_exit"

      - name: Record container status
        if: always()
        run: |
          mkdir -p "$CI_RESULTS_DIR"
          docker compose ps -a > "$CI_RESULTS_DIR/container-status.txt"

      - name: Clean up disposable CI containers
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-test-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.CI_RESULTS_DIR }}/
          if-no-files-found: error
          retention-days: 30

  sast:
        name: SAST - Semgrep
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        defaults:
          run:
            shell: bash

        env:
          SAST_RESULTS_DIR: /tmp/ie3142-sast-results

        steps:
          - name: Check out repository
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              persist-credentials: false

          - name: Record scan inputs
            run: |
              mkdir -p "$SAST_RESULTS_DIR"
              git rev-parse HEAD > "$SAST_RESULTS_DIR/source-commit.txt"
              sha256sum .semgrep/php.yml > "$SAST_RESULTS_DIR/rules.sha256"
              cp .semgrep/php.yml "$SAST_RESULTS_DIR/rules.yml"
              printf '%s/%s/actions/runs/%s\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
                > "$SAST_RESULTS_DIR/run-url.txt"
              docker pull semgrep/semgrep:1.177.0
              docker image inspect semgrep/semgrep:1.177.0 \
                --format '{{index .RepoDigests 0}}' \
                > "$SAST_RESULTS_DIR/scanner-image.txt"

          - name: Scan PHP source with frozen rules
            run: |
              set +e
              docker run --rm --network none \
                -v "$PWD:/src:ro" \
                -v "$SAST_RESULTS_DIR:/results" \
                -w /src \
                semgrep/semgrep:1.177.0 semgrep scan \
                --config .semgrep/php.yml \
                --oss-only --metrics=off --disable-version-check \
                --no-rewrite-rule-ids --include '*.php' \
                --json-output /results/semgrep.json \
                --sarif-output /results/semgrep.sarif . \
                2>&1 | tee "$SAST_RESULTS_DIR/semgrep-console.txt"
              scan_exit=$?
              set -e
              printf '%s\n' "$scan_exit" > "$SAST_RESULTS_DIR/exit-code.txt"
              printf 'Semgrep exit code: %s\n' "$scan_exit"
              exit "$scan_exit"

          - name: Summarize findings and check scan coverage
            run: |
              python3 - <<'PY'
              import json
              import os
              from collections import Counter
              from pathlib import Path

              output = Path(os.environ['SAST_RESULTS_DIR'])
              report = json.loads((output / 'semgrep.json').read_text())
              findings = report['results']
              errors = report['errors']
              scanned = set(report['paths']['scanned'])
              skipped_rules = report.get('skipped_rules', [])
              counts = Counter(item['extra']['severity'] for item in findings)
              required = {
                  'vulnerabilities/sqli/source/low.php',
                  'vulnerabilities/xss_r/source/low.php',
                  'vulnerabilities/exec/source/low.php',
                  'vulnerabilities/fi/source/low.php',
                  'vulnerabilities/fi/index.php',
              }
              missing = sorted(required - scanned)
              summary = '\n'.join([
                  '# Semgrep SAST',
                  '',
                  f"Semgrep version: {report['version']}",
                  f'PHP files scanned: {len(scanned)}',
                  f'Total findings: {len(findings)}',
                  f"ERROR: {counts['ERROR']}",
                  f"WARNING: {counts['WARNING']}",
                  f"INFO: {counts['INFO']}",
                  f'Scan errors: {len(errors)}',
                  f'Skipped rules: {len(skipped_rules)}',
                  f'Missing required files: {len(missing)}',
                  '',
                  'Mode: report all findings; no severity gate configured yet.',
              ]) + '\n'
              print(summary)
              (output / 'summary.md').write_text(summary)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
                  handle.write(summary)
              if errors or skipped_rules or missing:
                  print('::error::Incomplete SAST scan. Inspect the saved reports.')
                  if missing:
                      print('Missing files:', ', '.join(missing))
                  raise SystemExit(1)
              PY

          - name: Upload SAST evidence
            if: always()
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
            with:
              name: sast-${{ github.run_number }}-${{ github.run_attempt }}
              path: ${{ env.SAST_RESULTS_DIR }}/
              if-no-files-found: error
              retention-days: 30

  sca:
    name: SCA - Composer audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      SCA_RESULTS_DIR: /tmp/ie3142-sca-results
      COMPOSER_IMAGE: composer@sha256:9715c7f69044da2a212a5fbde29ee7da24e364d426560ae6367b060236f847d7

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record dependency inputs and prepare Composer
        run: |
          mkdir -p "$SCA_RESULTS_DIR"
          git rev-parse HEAD > "$SCA_RESULTS_DIR/source-commit.txt"
          sha256sum vulnerabilities/api/composer.json \
            vulnerabilities/api/composer.lock > "$SCA_RESULTS_DIR/dependencies.sha256"
          cp vulnerabilities/api/composer.json "$SCA_RESULTS_DIR/composer.json"
          cp vulnerabilities/api/composer.lock "$SCA_RESULTS_DIR/composer.lock"
          printf '%s/%s/actions/runs/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > "$SCA_RESULTS_DIR/run-url.txt"
          printf '%s\n' "$COMPOSER_IMAGE" > "$SCA_RESULTS_DIR/scanner-image.txt"
          docker pull "$COMPOSER_IMAGE"
          docker run --rm --network none "$COMPOSER_IMAGE" --version \
            2>&1 | tee "$SCA_RESULTS_DIR/composer-version.txt"

      - name: Validate dependency files
        run: |
          docker run --rm --network none \
            -v "$PWD/vulnerabilities/api:/app:ro" -w /app \
            "$COMPOSER_IMAGE" \
            --no-interaction --no-plugins --no-scripts \
            validate --no-check-publish \
            2>&1 | tee "$SCA_RESULTS_DIR/validate-console.txt"

      - name: Audit locked dependencies
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > "$SCA_RESULTS_DIR/audit-time-utc.txt"
          set +e
          docker run --rm \
            -v "$PWD/vulnerabilities/api:/app:ro" -w /app \
            "$COMPOSER_IMAGE" \
            --no-interaction --no-plugins --no-scripts \
            audit --locked --format=json --abandoned=fail \
            > "$SCA_RESULTS_DIR/composer-audit.json" \
            2> "$SCA_RESULTS_DIR/audit-stderr.txt"
          audit_exit=$?
          set -e
          printf '%s\n' "$audit_exit" > "$SCA_RESULTS_DIR/exit-code.txt"
          cat "$SCA_RESULTS_DIR/audit-stderr.txt"
          cat "$SCA_RESULTS_DIR/composer-audit.json"
          printf '\nComposer audit exit code: %s\n' "$audit_exit"
          exit "$audit_exit"

      - name: Summarize dependency audit
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ['SCA_RESULTS_DIR'])
          audit_file = output / 'composer-audit.json'
          if not audit_file.is_file() or audit_file.stat().st_size == 0:
              raise SystemExit('No audit report was produced. Check the earlier steps.')
          report = json.loads(audit_file.read_text())
          if not isinstance(report, dict) or not report:
              raise SystemExit('Unexpected audit report format. Inspect the saved report.')
          lock = json.loads((output / 'composer.lock').read_text())
          packages = lock['packages'] + lock.get('packages-dev', [])
          if not packages:
              raise SystemExit('No locked packages were available to audit.')
          audit_exit = int((output / 'exit-code.txt').read_text().strip())
          summary = '\n'.join([
              '# Composer dependency audit',
              '',
              'Scope: vulnerabilities/api/composer.lock, including dev dependencies.',
              f'Locked packages: {len(packages)}',
              f'Composer audit exit code: {audit_exit}',
              'Policy: any nonzero Composer audit result fails this job.',
              '',
              'Full audit report:',
              '```json',
              json.dumps(report, indent=2),
              '```',
          ]) + '\n'
          print(summary)
          (output / 'summary.md').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write(summary)
          PY

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sca-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.SCA_RESULTS_DIR }}/
          if-no-files-found: error
          retention-days: 30

  secret-scan:
    name: Secrets - Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      SECRETS_RESULTS_DIR: /tmp/ie3142-secrets-results
      # Gitleaks v8.30.1, pinned to its published image digest.
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record inputs and prepare Gitleaks
        run: |
          mkdir -p "$SECRETS_RESULTS_DIR" "$RUNNER_TEMP/ie3142-gitleaks-raw"
          git rev-parse HEAD > "$SECRETS_RESULTS_DIR/source-commit.txt"
          git rev-list --all --count > "$SECRETS_RESULTS_DIR/commits-available.txt"
          printf '%s/%s/actions/runs/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > "$SECRETS_RESULTS_DIR/run-url.txt"
          printf '[extend]\nuseDefault = true\n' > "$SECRETS_RESULTS_DIR/gitleaks.toml"
          : > "$SECRETS_RESULTS_DIR/gitleaksignore.txt"
          printf '%s\n' "$GITLEAKS_IMAGE" > "$SECRETS_RESULTS_DIR/scanner-image.txt"
          docker pull "$GITLEAKS_IMAGE"
          docker run --rm --network none "$GITLEAKS_IMAGE" version \
            2>&1 | tee "$SECRETS_RESULTS_DIR/gitleaks-version.txt"

      - name: Scan Git history for secrets
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > "$SECRETS_RESULTS_DIR/scan-time-utc.txt"
          set +e
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/src:ro" \
            -v "$SECRETS_RESULTS_DIR:/results:ro" \
            -v "$RUNNER_TEMP/ie3142-gitleaks-raw:/raw" \
            -w /src "$GITLEAKS_IMAGE" git /src \
            --config=/results/gitleaks.toml \
            --gitleaks-ignore-path=/results/gitleaksignore.txt \
            --ignore-gitleaks-allow --log-opts="--all" \
            --redact=100 --no-banner --no-color \
            --exit-code=10 --report-format=json \
            --report-path=/raw/gitleaks.json \
            2>&1 | tee "$SECRETS_RESULTS_DIR/gitleaks-console.txt"
          scan_exit=$?
          set -e
          printf '%s\n' "$scan_exit" > "$SECRETS_RESULTS_DIR/exit-code.txt"
          printf 'Gitleaks exit code: %s\n' "$scan_exit"
          exit "$scan_exit"

      - name: Save finding locations and summarize scan
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ['SECRETS_RESULTS_DIR'])
          raw = Path(os.environ['RUNNER_TEMP']) / 'ie3142-gitleaks-raw/gitleaks.json'
          if not raw.is_file() or raw.stat().st_size == 0:
              raise SystemExit('No Gitleaks report was produced. Check the scan log.')
          try:
              findings = json.loads(raw.read_text())
          finally:
              raw.unlink(missing_ok=True)
          scan_exit = int((output / 'exit-code.txt').read_text().strip())
          if findings is None and scan_exit == 0:
              findings = []
          if not isinstance(findings, list) or any(not isinstance(f, dict) for f in findings):
              raise SystemExit('Unexpected Gitleaks report format.')

          # Preserve locations, but omit Secret, Match and commit Message fields.
          fields = ('RuleID', 'File', 'StartLine', 'EndLine', 'Commit', 'Fingerprint')
          safe_findings = [{key: finding.get(key) for key in fields} for finding in findings]
          (output / 'gitleaks-locations.json').write_text(
              json.dumps(safe_findings, indent=2) + '\n'
          )
          commits = int((output / 'commits-available.txt').read_text().strip())
          summary = '\n'.join([
              '# Gitleaks secret scan',
              '',
              'Scope: Git history across all fetched refs.',
              'Rules: built-in defaults; no project exclusions or baseline.',
              f'Commits available in checkout: {commits}',
              f'Potential secret findings: {len(findings)}',
              f'Gitleaks exit code: {scan_exit}',
              'Policy: any finding or scanner error fails this job.',
              'The saved JSON contains finding locations, without matched values.',
          ]) + '\n'
          print(summary)
          (output / 'summary.md').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write(summary)
          if scan_exit != (10 if findings else 0):
              raise SystemExit('Unexpected scanner result. Review the scan log.')
          PY

      - name: Upload secret scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secrets-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.SECRETS_RESULTS_DIR }}/
          if-no-files-found: error
          retention-days: 30